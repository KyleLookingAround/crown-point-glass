# ── Emergency band (the loud amber strip near the top) ─────────────
emergency:
  label: "Broken glass right now?"
  headline: "Boarded up and made safe — 24 hours a day."
  body: "Break-in, storm damage or an accident, we're out day or night with a 30–60 minute response wherever possible. We board the opening, clear the glass and secure the property — and because our locksmith is on the same van, a forced door gets a working lock the same visit."
  cta: "What happens on a call-out"

# ── About ──────────────────────────────────────────────────────────
story:
  label: "01 — Who we are"
  heading: "A glass works, not a middleman."
  lede: "We make our own glass and fit it with our own installers — so a job doesn't sit waiting on somebody else's delivery van."
  paragraphs:
    - "Crown Point Glass is a glass manufacturer, glazing contractor and locksmith covering Greater Manchester and Cheshire. Because the glass is made in our own works, we control the lead time on the things that usually hold a job up: an odd-sized pane, a toughened unit, a shopfront that has to be right first time."
    - "The work splits three ways. Planned installation — windows, doors, glazing and balustrades, typically a three week turnaround from survey. Reactive work — 24 hour boarding and repairs, with a locksmith on the same van. And supply, making glass to order for trade and for anyone who'd rather fit it themselves."
    - "We're an Assure certified installer, our glazing installs carry a 5 year manufacturers guarantee, and surveys and quotes are free with no obligation. Domestic or commercial, one pane or a whole frontage — turn up when we said, do it properly, leave the place tidy."
  signature: "Crown Point Glass"

# ── "What we do" — three cards ─────────────────────────────────────
inside:
  - title: "Made in our own works"
    body: "Cut, toughened and made up on our own premises — panes, sealed units, balustrade glass and safety glass, without waiting on a third-party supplier. Supply-only is fine if you'd rather fit it yourself."
  - title: "Fitted by our own installers"
    body: "Windows, doors, glazing and balustrades installed by the people who made the glass. Assure certified, Heritage composite doors, and a 5 year manufacturers guarantee on glazing installs."
  - title: "A locksmith on the same van"
    body: "Emergency boarding and repairs around the clock, with non-destructive entry prioritised and no call-out charge on locksmith work. A forced door gets glazed and locked on one visit."

# ── Who we work for ────────────────────────────────────────────────
sectors:
  - category: "Homeowners"
    name: "Domestic"
    body: "Misted or blown double glazing, cracked panes, new windows and doors, balustrades and lock-outs. Free no-obligation survey and quote."
  - category: "Business & property"
    name: "Commercial"
    body: "Shopfronts, offices, schools and landlords. Toughened and laminated glass, balustrades, and a number that gets answered out of hours."
  - category: "Trade"
    name: "Supply only"
    body: "Cut-to-size and toughened glass and made-to-order sealed units, supplied to builders, joiners, shopfitters and other glaziers across the region."

