#  CROWN POINT GLASS · quote page (quote.html)
#
#  The free-survey policy, turnaround and guarantees below come from the
#  previous crownpointglass.co.uk site. Check they're still current.
# ════════════════════════════════════════════════════════════════════

intro: "Send us the sizes, or just a photo of what's broken, and we'll come back with a price. Site surveys and quotes are free, with no obligation to take it."

quoteTypes:
  - title: "Replacement glass"
    body: "Measure the glass itself, not the frame — width, height and the thickness if you can see it. A photo of the pane and the surrounding frame usually tells us the rest. Glass-only replacement is fine; the frames can stay."
  - title: "Windows, doors & balustrades"
    body: "Rough opening sizes and a photo of the outside will do to start, then we'll come and survey properly before anything is ordered. Typically a three week turnaround from survey to installation."
  - title: "Commercial & supply only"
    body: "Send a schedule or a drawing and we'll price it line by line — toughened and laminated specs, sizes and lead times. Happy to supply only if you're fitting it yourself."

# ── What to send us ────────────────────────────────────────────────
checklist:
  - "The address, or at least the postcode"
  - "What's broken, and whether it's currently open to the weather"
  - "Sizes if you have them — width × height in mm"
  - "A photo or two, taken from far enough back to see the frame"
  - "Whether it's going through insurance"

# ── Response promise ───────────────────────────────────────────────
promise: "Free survey, no obligation, and a 5 year manufacturers guarantee on glazing installs. If it's an emergency, don't email — ring the 24hr number and we'll come out."
