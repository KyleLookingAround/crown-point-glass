# ════════════════════════════════════════════════════════════════════
#  CROWN POINT GLASS · services page (services.html)
#
#  Each service is a card. `icon` picks one of the built-in line drawings:
#  window · door · shield · pane · lock · van · mirror · shop
# ════════════════════════════════════════════════════════════════════

intro: "Everything from a single cracked pane to a full commercial frontage. Glass cut and toughened in our own works, fitted by our own installers, across Greater Manchester and Cheshire."
note: "No call-out charge to quote. Emergency make-safe available 24/7."

services:
  - icon: pane
    title: "Double glazing replacement"
    body: "Misted, blown or cracked sealed units swapped for new ones. We measure, make the unit and fit it — the frames stay where they are, so it's a fraction of the cost of new windows."
    points:
      - "Misted and blown units"
      - "A-rated and low-E glass"
      - "Argon-filled and warm-edge spacers"
      - "Guaranteed sealed units"

  - icon: window
    title: "Windows & doors"
    body: "Supply and installation of uPVC and aluminium windows and doors, for houses, flats and commercial premises. Replacements for failed frames, and new openings worked in with the builder."
    points:
      - "uPVC and aluminium"
      - "Casement, sash and tilt-and-turn"
      - "Composite and patio doors"
      - "Trickle vents and restrictors"

  - icon: shield
    title: "Emergency board-up & make-safe"
    body: "24 hours a day across the Manchester area, aiming to be on site within the hour. We board the opening, clear the broken glass and make the property secure, then return to glaze it properly."
    points:
      - "Break-ins and vandalism"
      - "Storm and accidental damage"
      - "Insurance work and reports"
      - "Commercial and residential"

  - icon: shop
    title: "Shopfronts & commercial glazing"
    body: "Toughened and laminated shopfront glass, entrance doors, partitions and manifestation. Out-of-hours fitting where a daytime closure isn't an option."
    points:
      - "Toughened and laminated"
      - "Fire-rated glazing"
      - "Manifestation and film"
      - "Out-of-hours installation"

  - icon: mirror
    title: "Made-to-measure glass"
    body: "Cut, polished, drilled and toughened to your sizes in our own works. Table tops, shelves, mirrors, splashbacks, cabinet glass and greenhouse panes."
    points:
      - "Mirrors and splashbacks"
      - "Table tops and shelving"
      - "Polished and bevelled edges"
      - "Toughened safety glass"

  - icon: lock
    title: "Locks, handles & hardware"
    body: "Locksmithing alongside the glazing — so a forced door gets a working lock the same visit, not a second appointment with somebody else."
    points:
      - "Lock changes and upgrades"
      - "Euro cylinders and multipoints"
      - "Hinges, handles and letterplates"
      - "Snapped and seized locks"

  - icon: van
    title: "Trade glass supply"
    body: "Cut-to-size and processed glass supplied to builders, joiners, shopfitters and other glaziers. Collection from the works or delivery across the region."
    points:
      - "Cut to size and toughened"
      - "Sealed units to order"
      - "Trade pricing"
      - "Collection or delivery"

  - icon: door
    title: "Insurance & landlord work"
    body: "Regular glazing and make-safe work for letting agents, housing providers and insurers, with photographs, reports and invoicing that match what the claim needs."
    points:
      - "Photographic reports"
      - "Direct-to-insurer invoicing"
      - "Multi-property schedules"
      - "Priority response"
