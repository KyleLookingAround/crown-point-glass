#  CROWN POINT GLASS · services page (services.html)
#
#  These are the six services the business runs, matching the structure of
#  the previous crownpointglass.co.uk site.
#
#  `icon` picks one of the built-in line drawings:
#  window · door · shield · pane · lock · van · mirror · shop · rail
# ════════════════════════════════════════════════════════════════════

intro: "Glass manufactured in our own works, installed by our own fitters, and a locksmith on the same van. Domestic, commercial and trade, across Greater Manchester and Cheshire."
note: "Free, no-obligation quotes and site surveys. Emergency boarding and repairs 24/7."

services:
  - icon: shield
    title: "24 hour call-out"
    body: "Emergency boarding and repairs, day or night. We make the property safe and secure first, then come back and glaze it properly once the unit is ready."
    points:
      - "Minimum call-out £160 + VAT between 5pm and 8am"
      - "No call-out charge between 8am and 5pm"
      - "Labour charged for any work undertaken"
      - "Break-ins, storm damage and accidental breakage"

  - icon: pane
    title: "Glass manufacturing"
    body: "We make the glass ourselves rather than waiting on a supplier — so odd sizes, toughened units and one-off panes don't hold a job up."
    points:
      - "Cut and toughened to your sizes"
      - "Sealed units made to order"
      - "Supply-only available"
      - "Trade welcome"

  - icon: window
    title: "Window & door installation"
    body: "Supply and installation of windows and doors for homes and commercial premises. We survey, make and fit — we don't fit frames supplied by anyone else."
    points:
      - "Typically a 3 week turnaround from survey"
      - "Heritage composite doors"
      - "Free no-obligation site survey"
      - "Supply and install only — no install-only service"

  - icon: mirror
    title: "Glazing"
    body: "Glazing repairs and installs of every size, from a single misted unit to a full replacement. Glass-only replacement is fine — the frames can stay where they are."
    points:
      - "5 year manufacturers guarantee on installs"
      - "Misted and blown double-glazed units"
      - "Glass replacement only available"
      - "Domestic and commercial"

  - icon: rail
    title: "Balustrades"
    body: "Glass balustrades and railings for stairs, landings, balconies and terraces — measured, made and installed by us."
    points:
      - "Toughened and laminated safety glass"
      - "Stairs, landings and balconies"
      - "Internal and external"
      - "Made to measure"

  - icon: lock
    title: "Locksmithing"
    body: "A locksmith alongside the glazing, so a forced door gets a working lock on the same visit. Non-destructive entry wherever possible — we'd rather pick a lock than replace it."
    points:
      - "No call-out charge — labour, parts and VAT only"
      - "30–60 minute emergency response where possible"
      - "Non-destructive entry prioritised"
      - "1 year guarantee on work and parts"
