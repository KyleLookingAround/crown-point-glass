# ════════════════════════════════════════════════════════════════════
#  CROWN POINT GLASS · business settings
#
#  Everything here feeds the whole site: the header, the footer, the
#  contact panel, the opening-hours table, the live open/closed pill and
#  the Google listing (structured data). Change it once, here.
#
#  Most values below come from the previous crownpointglass.co.uk site.
#  The few that weren't on the archived pages are marked CONFIRM.
# ════════════════════════════════════════════════════════════════════

url: https://crownpointglass.co.uk/
name: Crown Point Glass
legalName: Crown Point Glass Limited
description: Glaziers, glass manufacturers and locksmiths covering Greater Manchester and Cheshire — window and door installation, glazing, balustrades and 24hr emergency boarding and repairs.
strapline: Glass made, supplied and fitted.

# ── Contact ────────────────────────────────────────────────────────
# Both numbers are as advertised in the banner on the old site.
phone: '0161 943 5424'
emergencyPhone: '07726 353078'

# The old site published no email address — enquiries went through a form.
# Leave this blank to keep it that way: the site will show the contact form
# and the phone numbers instead of any "email us" links. Fill it in only if
# you actually want an inbox advertised.
email: ''

# ── Enquiry form ───────────────────────────────────────────────────
# A static site can't process a form on its own, so the form needs an
# endpoint from a form service (Formspree, Web3Forms, Basin, Getform…).
# Paste the endpoint URL here and the contact form starts working.
# While it's blank the contact page shows the phone numbers instead of a
# form that would silently go nowhere.
formEndpoint: ''

# ── Where we are ───────────────────────────────────────────────────
# The business doesn't publish a street address — the old site showed only
# phone numbers and a map of Manchester, which is normal for a mobile trade.
# Leave street/postcode blank to keep it that way; the site then presents
# itself as a service-area business (no address in the footer, no postal
# address in the Google structured data) and the map centres on `mapArea`.
street: ''
postcode: ''
locality: Manchester
region: Greater Manchester
country: GB
mapArea: Manchester, UK
companyNumber: '14725550'

# ── Where we work ──────────────────────────────────────────────────
areasIntro: We cover Greater Manchester and Cheshire, with emergency boarding and repairs across the Manchester area around the clock.
areas:
  - Manchester
  - Stockport
  - Denton
  - Tameside
  - Trafford
  - Salford
  - Oldham
  - Rochdale
  - Bury
  - Bolton
  - Wigan
  - Cheshire East
  - Cheshire West
  - Warrington

# ── Social ─────────────────────────────────────────────────────────
# The old site linked a locksmith account (@cjllocksmith); this is the
# business's own Instagram. The Facebook page still trades under a
# different name — worth deciding which identity leads.
facebook: https://www.facebook.com/secure24glazing/
instagram: https://www.instagram.com/crownpointglass
instagramHandle: '@crownpointglass'
previewImage: /assets/share-card.png

# ── Opening hours ──────────────────────────────────────────────────
# ⚠ CONFIRM — placeholder office hours; the archived pages didn't list any.
# They're set to 08:00–17:00 to line up with the emergency pricing on the
# old site, which charges a call-out between 5pm and 8am.
hours:
  - fromDay: Mo
    toDay: Fr
    open: '08:00'
    close: '17:00'
  - fromDay: Sa
    open: '09:00'
    close: '13:00'
  - fromDay: Su
    closed: true

# The out-of-hours promise shown next to the hours table.
emergencyNote: Emergency boarding and repairs run 24 hours a day, seven days a week — including when the office is shut. Call 07726 353078.

# ── Trust strip (shown above the footer) ───────────────────────────
credentials:
  - name: Assure Certified Installer
    url: https://www.assurecertification.co.uk/
    image: /assets/assure-certified.png
  - name: Companies House — Crown Point Glass Limited
    url: https://find-and-update.company-information.service.gov.uk/company/14725550
  - name: Find us on Facebook
    url: https://www.facebook.com/secure24glazing/
